<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreelanceComm Booking Chatbot - Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }
        
        .result.success {
            background: #d4edda;
            border: 2px solid #c3e6cb;
            color: #155724;
        }
        
        .result.error {
            background: #f8d7da;
            border: 2px solid #f5c6cb;
            color: #721c24;
        }
        
        .result h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        .result p {
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .meet-link {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        .meet-link:hover {
            background: #5568d3;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            font-size: 13px;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📅 Book a Meeting</h1>
        <p class="subtitle">Schedule a Google Meet with FreelanceComm</p>
        
        <div class="info-box">
            <strong>ℹ️ Note:</strong> Both you and freelancecomm9@gmail.com will receive the meeting invite.
        </div>
        
        <form id="bookingForm">
            <div class="form-group">
                <label for="name">Your Name *</label>
                <input type="text" id="name" name="name" required placeholder="John Doe">
            </div>
            
            <div class="form-group">
                <label for="email">Your Email *</label>
                <input type="email" id="email" name="email" required placeholder="john@example.com">
            </div>
            
            <div class="form-group">
                <label for="meetingTime">Meeting Date & Time *</label>
                <input type="datetime-local" id="meetingTime" name="meetingTime" required>
            </div>
            
            <div class="form-group">
                <label for="duration">Duration (minutes)</label>
                <input type="number" id="duration" name="duration" value="30" min="15" max="120" step="15">
            </div>
            
            <div class="form-group">
                <label for="message">Message (Optional)</label>
                <textarea id="message" name="message" placeholder="Tell us what you'd like to discuss..."></textarea>
            </div>
            
            <button type="submit" id="submitBtn">Schedule Meeting</button>
        </form>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #666;">Creating your meeting...</p>
        </div>
        
        <div class="result" id="result"></div>
    </div>
    
    <script>
        // Set minimum datetime to now
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('meetingTime').min = now.toISOString().slice(0, 16);
        
        // Set default datetime to 1 hour from now
        const defaultTime = new Date(now.getTime() + 60 * 60 * 1000);
        document.getElementById('meetingTime').value = defaultTime.toISOString().slice(0, 16);
        
        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            
            // Get form data
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                meetingTime: new Date(document.getElementById('meetingTime').value).toISOString(),
                duration: parseInt(document.getElementById('duration').value),
                message: document.getElementById('message').value
            };
            
            // Show loading
            submitBtn.disabled = true;
            loading.style.display = 'block';
            result.style.display = 'none';
            
            try {
                const response = await fetch('http://localhost:5000/api/bookings', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                // Hide loading
                loading.style.display = 'none';
                submitBtn.disabled = false;
                
                // Show result
                result.style.display = 'block';
                
                if (data.status === 'success') {
                    result.className = 'result success';
                    result.innerHTML = `
                        <h3>✅ Meeting Scheduled Successfully!</h3>
                        <p><strong>Meeting ID:</strong> ${data.data.bookingId}</p>
                        <p><strong>Start Time:</strong> ${new Date(data.data.startTime).toLocaleString()}</p>
                        <p><strong>Duration:</strong> ${formData.duration} minutes</p>
                        <p><strong>Attendees:</strong></p>
                        <ul style="margin-left: 20px; margin-top: 5px;">
                            <li>${formData.email}</li>
                            <li>freelancecomm9@gmail.com</li>
                        </ul>
                        <p style="margin-top: 15px;"><strong>📧 Calendar invites have been sent to both emails!</strong></p>
                        <a href="${data.data.meetLink}" target="_blank" class="meet-link">🎥 Join Google Meet</a>
                    `;
                    
                    // Reset form
                    document.getElementById('bookingForm').reset();
                    const newDefaultTime = new Date(now.getTime() + 60 * 60 * 1000);
                    document.getElementById('meetingTime').value = newDefaultTime.toISOString().slice(0, 16);
                    document.getElementById('duration').value = 30;
                } else {
                    result.className = 'result error';
                    result.innerHTML = `
                        <h3>❌ Error</h3>
                        <p>${data.message}</p>
                    `;
                }
            } catch (error) {
                loading.style.display = 'none';
                submitBtn.disabled = false;
                result.style.display = 'block';
                result.className = 'result error';
                result.innerHTML = `
                    <h3>❌ Connection Error</h3>
                    <p>Failed to connect to the server. Please make sure the backend is running on http://localhost:5000</p>
                    <p style="margin-top: 10px; font-size: 12px; color: #666;">${error.message}</p>
                `;
            }
        });
    </script>
</body>
</html>
